<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 以下 title / description 为无 JS 时的兜底；正常情况下会被 config.js 的 meta 覆盖 -->
  <title>Your Name</title>
  <meta name="description" content="Academic homepage of Your Name.">
  <meta name="author" content="Your Name">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <meta name="theme-color" content="#ffffff">

  <!-- 主题/语言启动脚本：必须在 CSS 之前执行，避免刷新时闪白/闪语言 -->
  <script>
  (function () {
    try {
      var t = localStorage.getItem("theme");
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      var l = localStorage.getItem("lang");
      if (l !== "zh" && l !== "en") {
        l = (navigator.language || "en").toLowerCase().indexOf("zh") === 0 ? "zh" : "en";
      }
      var d = document.documentElement;
      d.setAttribute("data-theme", t);
      d.setAttribute("data-lang", l);
      if (l === "zh") d.lang = "zh-CN";
    } catch (e) { /* 隐私模式下 localStorage 不可用时静默降级 */ }
  })();
  </script>

  <!-- 字体：Montserrat（标题）+ Roboto（正文）+ Roboto Mono（代码），与原站一致 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Roboto:ital,wght@0,400;0,500;0,700;1,400&family=Roboto+Mono&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<a class="skip-link" href="#bio">
  <span lang="en">Skip to content</span><span lang="zh">跳到正文</span>
</a>

<!-- 禁用 JS 时的提示（内容已移到 config.js，由 JS 渲染） -->
<noscript>
  <div class="noscript-tip">
    <p lang="en">This page loads its content with JavaScript. Please enable JavaScript to view it.</p>
    <p lang="zh">本页面内容通过 JavaScript 加载，请启用 JavaScript 后查看。</p>
  </div>
</noscript>

<!-- ======================= 顶部导航栏 ======================= -->
<!-- 品牌名与导航链接由 render.js 按 config.js 生成 -->
<header class="navbar" id="navbar">
  <div class="container navbar-inner">
    <a class="navbar-brand" href="#bio"></a>

    <div class="navbar-right">
      <nav class="nav-menu" id="nav-menu" aria-label="Main navigation"></nav>

      <!-- 深色模式切换：浅色时显示月亮，深色时显示太阳 -->
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle theme">
        <svg class="icon icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="icon icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>

      <!-- 中英切换：按钮文字由 CSS 按 [lang] 自动换（英文页显示「中文」，中文页显示 EN） -->
      <button class="icon-btn lang-btn" id="lang-toggle" type="button" aria-label="Switch language">
        <span lang="en">中文</span><span lang="zh">EN</span>
      </button>

      <button class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="nav-menu" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<!-- ======================= 正文（全部内容由 render.js 按 config.js 渲染） ======================= -->
<main id="site-main"></main>

<!-- ======================= 页脚（内容由 render.js 生成） ======================= -->
<footer class="footer">
  <div class="container" id="footer-content"></div>
</footer>

<!-- ======================= Cite 弹窗 ======================= -->
<div class="modal" id="cite-modal" role="dialog" aria-modal="true" aria-labelledby="cite-title" hidden>
  <div class="modal-backdrop" data-close-modal></div>
  <div class="modal-dialog">
    <div class="modal-header">
      <h5 id="cite-title"><span lang="en">Cite</span><span lang="zh">引用</span></h5>
      <button class="modal-close" type="button" data-close-modal aria-label="Close">&times;</button>
    </div>
    <div class="modal-body">
      <pre><code id="cite-code"></code></pre>
    </div>
    <div class="modal-footer">
      <button class="btn" id="cite-copy" type="button">
        <span class="btn-label"><span lang="en">Copy</span><span lang="zh">复制</span></span>
      </button>
      <button class="btn" id="cite-download" type="button">
        <span class="btn-label"><span lang="en">Download</span><span lang="zh">下载</span></span>
      </button>
    </div>
  </div>
</div>

<!-- 三支脚本必须保持此顺序、同步加载（勿加 async/defer）：
     config.js 定义 SITE_CONFIG → render.js 渲染内容 → main.js 绑定交互 -->
<script src="config.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
